<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>More Muscle Workout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER (Sempre visibile) -->
  <header>
    <img src="https://drive.google.com/thumbnail?id=1tU0CSrd0u14kCq-AvKjG32ecDegrzAV7" alt="Logo">
    <h1>MORE MUSCLE WORKOUT</h1>
  </header>

  <main>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
      <div class="login-card">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="login-button">Accedi</button>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" style="display: none;">
      <div id="setup-screen">
        <button id="logout-button">Logout</button>

        <label for="workoutSelect">Seleziona workout:</label>
        <select id="workoutSelect">
          <option value="">-- Seleziona --</option>
        </select>

        <label for="soundMode">Modalità audio:</label>
        <select id="soundMode">
          <option value="voice">Solo Voce</option>
          <option value="beep">Solo Beep</option>
          <option value="none">Nessun Suono</option>
        </select>

        <button id="start-button">Start Workout</button>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
