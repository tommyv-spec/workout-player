<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="https://drive.google.com/thumbnail?id=12BkxTeS2OhJjuAPXGsRgP-KHrCXjul05" alt="Logo" />
    <h1>Workout Trainer</h1>
  </header>

  <main>
    <div id="login-screen">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username"><br><br>
      <input type="password" id="password" placeholder="Password"><br><br>
      <button id="login-button">Accedi</button>
      <p id="login-error" style="color: red; display: none;">Credenziali errate</p>
    </div>
    
    <div id="main-app" style="display: none;">
      <div id="setup-screen">
      <label for="userSelect">Seleziona utente:</label>
      <select id="userSelect">
        <option disabled selected>Scegli un utente</option>
      </select>
    
      <label for="workoutSelect">Seleziona workout:</label>
      <select id="workoutSelect"></select>
    
      <div style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
        <label for="beepToggle">Attiva bip:</label>
        <input type="checkbox" id="beepToggle" checked />
      </div>

    
      <button id="start-button" disabled>Start Workout</button>
    
      <div id="workout-preview" style="display: none;">
        <h3>Esercizi nel workout:</h3>
        <ul id="exercise-list"></ul>
      </div>

      <div id="exercise-visuals" style="display: none; margin-top: 20px;">
        <h3>Anteprima visiva:</h3>
        <div id="exercise-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;"></div>
      </div>

    </div>

    <div id="instructions-box" style="display: none; text-align: center; margin: 20px;">
      <strong>Istruzioni:</strong>
      <p id="instructions-text"></p>
    </div>




    <div id="exercise-container" style="display: none;">
    
      <h2 id="exercise-name"></h2>
      <img id="exercise-gif" src="" alt="Esercizio" />
    
      <div id="timer"></div>
      <button id="pause-button" style="margin-top: 10px;">⏸ Pausa</button>
    
      <div id="next-exercise-preview" style="display: none;">
        <p>Prossimo: <span id="next-exercise-name"></span></p>
        <img id="next-exercise-gif" src="" alt="Prossimo esercizio" />
      </div>
    </div>
      <!-- tutto il resto della tua app -->
    </div>


    
  </main>

  <!-- Suono del beep -->
  <audio id="beep-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <audio id="transition-sound" src="https://actions.google.com/sounds/v1/emergency/emergency_siren_short_burst.ogg" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
