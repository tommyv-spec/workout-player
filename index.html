<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
    .screen { display: none; }
    #login-screen, #setup-screen, #exercise-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    button { padding: 10px 20px; margin-top: 10px; }
    #exercise-gif, #next-exercise-gif { max-width: 100%; border-radius: 8px; }
    ul { list-style: none; padding-left: 0; }
    #exercise-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .hidden { display: none; }
    #logout-button { float: right; background: #ccc; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <button id="logout-button">Logout</button>
  </header>

  <div id="login-screen" class="screen">
    <h2>Login</h2>
    <input id="username" type="text" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button id="login-button">Login</button>
    <p id="login-error" style="color: red; display: none;"></p>
  </div>

  <div id="setup-screen" class="screen">
    <h2>Seleziona Workout</h2>
    <select id="workoutSelect"></select><br>
    <button id="start-button" disabled>Inizia</button>

    <div id="workout-preview" style="margin-top: 20px;">
      <h3>Esercizi</h3>
      <ul id="exercise-list"></ul>
      <div id="exercise-visuals">
        <div id="exercise-grid"></div>
      </div>
      <div id="instructions-box" style="margin-top: 20px;">
        <h4>Istruzioni:</h4>
        <p id="instructions-text"></p>
      </div>
    </div>
  </div>

  <div id="exercise-container" class="screen">
    <h2 id="exercise-name"></h2>
    <img id="exercise-gif" src="" alt="Exercise"><br>
    <h3 id="timer">0</h3>
    <button id="pause-button">⏸ Pausa</button>
    <div id="next-exercise-preview" style="margin-top: 20px; display: none;">
      <h4>Prossimo: <span id="next-exercise-name"></span></h4>
      <img id="next-exercise-gif" src="" alt="Next Exercise">
    </div>
    <div style="margin-top: 20px;">
      <label>
        <input type="checkbox" id="beepToggle" checked>
        Suoni di avviso
      </label>
    </div>
  </div>

  <audio id="beep-sound" src="beep.mp3" preload="auto"></audio>
  <audio id="transition-sound" src="transition.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
